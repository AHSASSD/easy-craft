<!doctype html>
<!-- PROTOTYPE: compare detail, capability-group and compact-list views. No real downloads, execution or filesystem deletion. -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Easy Craft · 扩展设计预览</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.5 'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        color: var(--text);
        background: var(--bg);
        --bg: #f2f5f4;
        --panel: #f8faf9;
        --card: #fff;
        --text: #263b35;
        --muted: #71827c;
        --line: #dce5e0;
        --accent: #2c8069;
        --soft: #e4f1eb;
        --danger: #bb5a53;
        --shadow: 0 16px 48px #24372e15;
      }
      body.dark {
        --bg: #1a2225;
        --panel: #182023;
        --card: #242e31;
        --text: #e2ebe7;
        --muted: #93a7a0;
        --line: #354145;
        --accent: #80c7ae;
        --soft: #283f39;
        --danger: #ed938a;
        --shadow: 0 16px 48px #0004;
      }
      button,
      input {
        font: inherit;
      }
      button {
        color: inherit;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 9px;
        padding: 9px 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      button:hover {
        border-color: var(--accent);
        background: var(--soft);
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      button:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--card);
      }
      button.ghost {
        border-color: transparent;
        background: transparent;
      }
      button.icon {
        padding: 8px;
        width: 35px;
        height: 35px;
        flex-shrink: 0;
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.8px;
      }
      h2 {
        font-size: 17px;
      }
      h3 {
        font-size: 15px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 5px;
        padding: 3px 7px;
        font-size: 11px;
        white-space: nowrap;
        background: var(--bg);
        color: var(--muted);
        border: 1px solid var(--line);
      }
      .badge.official {
        background: var(--soft);
        color: var(--accent);
        border: 0;
      }
      .titlebar {
        height: 49px;
        display: flex;
        align-items: center;
        padding: 0 22px;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .brand {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.1px;
      }
      .brand-icon {
        color: var(--accent);
      }
      .preview-note {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
      .shell {
        height: calc(100dvh - 49px);
        min-height: 480px;
        display: grid;
        grid-template-columns: 72px 282px minmax(0, 1fr);
      }
      .rail {
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 6px;
        gap: 12px;
      }
      .rail button {
        width: 60px;
        padding: 13px 4px;
        flex-direction: column;
        font-size: 12px;
        border: 0;
        background: transparent;
        gap: 7px;
      }
      .rail button.active {
        background: var(--soft);
        color: var(--accent);
      }
      .rail .bottom {
        margin-top: auto;
      }
      .sidebar {
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .side-head {
        padding: 22px 18px 14px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .side-head h2 {
        font-size: 19px;
      }
      .count {
        font-size: 12px;
        color: var(--muted);
      }
      .side-head button {
        margin-left: auto;
      }
      .search {
        margin: 0 16px 12px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        background: var(--bg);
        border-radius: 9px;
        color: var(--muted);
      }
      .search input {
        color: var(--text);
        background: none;
        border: 0;
        outline: 0;
        min-width: 0;
        width: 100%;
        font-size: 13px;
      }
      .filters {
        display: flex;
        padding: 0 16px 16px;
        gap: 5px;
      }
      .filters button {
        padding: 5px 10px;
        font-size: 12px;
        border: 0;
        background: none;
        color: var(--muted);
      }
      .filters button.active {
        background: var(--soft);
        color: var(--accent);
      }
      .plugin-list {
        overflow: auto;
        flex: 1;
        padding: 0 10px 12px;
        min-height: 0;
      }
      .row {
        border: 1px solid transparent;
        border-radius: 10px;
        margin-bottom: 6px;
        padding: 13px 10px;
        display: flex;
        align-items: center;
        gap: 9px;
        position: relative;
      }
      .row:hover {
        background: var(--bg);
      }
      .row.selected {
        background: var(--soft);
      }
      .row.selected:before {
        content: '';
        position: absolute;
        width: 3px;
        background: var(--accent);
        left: 0;
        top: 17px;
        bottom: 17px;
        border-radius: 3px;
      }
      .row-select {
        min-width: 0;
        flex: 1;
        display: flex;
        gap: 10px;
        text-align: left;
        border: 0;
        padding: 0;
        background: none !important;
        justify-content: flex-start;
        outline-offset: 4px;
      }
      .tile {
        height: 38px;
        width: 38px;
        display: grid;
        place-items: center;
        background: var(--tile, #e5ede9);
        color: var(--ink, #47705c);
        border-radius: 10px;
        flex-shrink: 0;
      }
      .tile svg {
        width: 22px;
        height: 22px;
      }
      .row-name {
        font-weight: 650;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-meta {
        font-size: 10px;
        color: var(--muted);
        margin-top: 4px;
        white-space: nowrap;
      }
      .row-info {
        min-width: 0;
      }
      .row-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .remove {
        color: var(--muted);
        width: 24px !important;
        height: 28px !important;
        padding: 3px !important;
        border: 0 !important;
        background: none !important;
      }
      .remove:hover {
        color: var(--danger);
      }
      .remove svg {
        width: 15px;
        height: 15px;
      }
      .switch {
        width: 32px;
        height: 19px;
        padding: 0;
        border: 0;
        background: #b4bfba;
        border-radius: 20px;
        position: relative;
        flex-shrink: 0;
      }
      .switch:after {
        content: '';
        position: absolute;
        height: 13px;
        width: 13px;
        left: 3px;
        top: 3px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 3px #0002;
        transition: transform 0.16s;
      }
      .switch[aria-checked='true'] {
        background: var(--accent);
      }
      .switch[aria-checked='true']:after {
        transform: translateX(13px);
      }
      .side-tools {
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 7px;
      }
      .side-tools > button {
        justify-content: flex-start;
        background: none;
      }
      .side-tools > button.primary {
        background: var(--accent);
        color: var(--card);
      }
      .account {
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 18px;
      }
      .avatar {
        width: 33px;
        height: 33px;
        background: linear-gradient(
          0deg,
          #9b7759 0 30%,
          #d7ad87 30% 67%,
          #76543d 67%
        );
        border-radius: 7px;
        position: relative;
      }
      .avatar:after {
        content: '▪ ▪';
        position: absolute;
        left: 7px;
        top: 10px;
        color: #3b4246;
        font-size: 14px;
      }
      .main {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .breadcrumb {
        height: 47px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--panel);
        padding: 0 26px;
        color: var(--muted);
        font-size: 12px;
        flex-shrink: 0;
      }
      .breadcrumb strong {
        color: var(--text);
        font-weight: 600;
      }
      .scroll {
        overflow: auto;
        flex: 1;
        padding: 27px 30px 90px;
      }
      .main-head {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 24px;
      }
      .main-head .spacer {
        flex: 1;
      }
      .intro {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }
      .summary {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .dot {
        height: 6px;
        width: 6px;
        background: var(--accent);
        border-radius: 50%;
        display: inline-block;
      }
      .hero {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        padding: 25px;
      }
      .hero-line {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .hero .tile {
        width: 64px;
        height: 64px;
        border-radius: 15px;
      }
      .hero .tile svg {
        height: 33px;
        width: 33px;
      }
      .hero-name {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .hero-name h2 {
        font-size: 22px;
      }
      .hero-description {
        color: var(--muted);
        margin-top: 7px;
        font-size: 13px;
      }
      .hero-controls {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        white-space: nowrap;
        font-size: 13px;
      }
      .hero-controls .switch {
        width: 42px;
        height: 24px;
      }
      .hero-controls .switch:after {
        width: 18px;
        height: 18px;
      }
      .hero-controls .switch[aria-checked='true']:after {
        transform: translateX(18px);
      }
      .tabs {
        display: flex;
        gap: 26px;
        margin-top: 25px;
        border-bottom: 1px solid var(--line);
      }
      .tabs span {
        padding-bottom: 12px;
        font-size: 13px;
        color: var(--muted);
      }
      .tabs .active {
        color: var(--accent);
        border-bottom: 2px solid var(--accent);
        font-weight: 650;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 235px;
        gap: 22px;
        margin-top: 22px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        padding: 21px;
      }
      .card p {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.85;
        margin-top: 12px;
      }
      .section-title {
        display: flex;
        gap: 9px;
        align-items: center;
        margin-bottom: 14px;
      }
      .slot-note {
        background: var(--bg);
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 12px;
        color: var(--muted);
        margin-top: 18px;
        line-height: 1.8;
      }
      .slot-note strong {
        color: var(--text);
        font-weight: 600;
      }
      .facts {
        margin: 0;
        font-size: 12px;
      }
      .facts > div {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .facts > div:last-child {
        border: 0;
      }
      .facts dt {
        color: var(--muted);
      }
      .facts dd {
        margin: 0;
        overflow-wrap: anywhere;
        text-align: right;
      }
      .landscape {
        margin-top: 18px;
        border-radius: 10px;
        background: #c5ded2;
        height: 156px;
        position: relative;
        overflow: hidden;
      }
      .landscape:before {
        content: '';
        position: absolute;
        inset: 44% -5% -15%;
        background: #507866;
        clip-path: polygon(
          0 40%,
          15% 30%,
          15% 18%,
          29% 18%,
          29% 35%,
          45% 35%,
          45% 2%,
          62% 2%,
          62% 28%,
          79% 28%,
          79% 50%,
          100% 50%,
          100% 100%,
          0 100%
        );
      }
      .landscape:after {
        content: '';
        position: absolute;
        inset: 66% -5% -15%;
        background: #294b3e;
        clip-path: polygon(
          0 33%,
          20% 33%,
          20% 4%,
          38% 4%,
          38% 44%,
          58% 44%,
          58% 22%,
          80% 22%,
          80% 0,
          100% 0,
          100% 100%,
          0 100%
        );
      }
      .preview-window {
        position: absolute;
        left: 24px;
        top: 20px;
        right: 24px;
        bottom: 20px;
        border: 1px solid #ffffff65;
        border-radius: 8px;
        background: #ffffffc9;
        z-index: 1;
        padding: 13px;
        color: #294b3e;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .preview-mini {
        width: 75px;
        height: 100%;
        border-radius: 4px;
        background: #dee9e3;
      }
      .preview-copy {
        flex: 1;
      }
      .preview-copy b {
        display: block;
        font-size: 13px;
      }
      .preview-copy i {
        display: block;
        width: 80%;
        height: 5px;
        background: #bfd2c7;
        margin-top: 9px;
      }
      .danger-text {
        color: var(--danger);
      }
      .foot {
        font-size: 11px;
        color: var(--muted);
        margin-top: 17px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .recommend {
        margin-top: 22px;
        display: flex;
        align-items: center;
        gap: 13px;
        font-size: 12px;
        color: var(--muted);
      }
      .recommend button {
        margin-left: auto;
      }
      .empty {
        text-align: center;
        padding: 50px 20px;
        color: var(--muted);
      }
      .switcher {
        position: fixed;
        bottom: 18px;
        left: calc(50% + 120px);
        transform: translateX(-50%);
        background: var(--card);
        padding: 5px;
        display: flex;
        gap: 3px;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        z-index: 10;
      }
      .switcher button {
        border: 0;
        background: none;
        padding: 6px 13px;
        font-size: 11px;
      }
      .switcher button.active {
        color: var(--accent);
        background: var(--soft);
      }
      .switcher > span {
        font-size: 10px;
        color: var(--muted);
        padding: 8px;
      }
      .toast-stack {
        position: fixed;
        right: 23px;
        top: 70px;
        display: grid;
        gap: 10px;
        z-index: 30;
        max-width: 380px;
      }
      .toast {
        padding: 15px 17px;
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        border-radius: 10px;
        box-shadow: var(--shadow);
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .toast button {
        border: 0;
        color: var(--accent);
        padding: 3px;
        background: none;
        white-space: nowrap;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .gallery .card {
        display: flex;
        gap: 13px;
        align-items: flex-start;
      }
      .gallery h3 {
        margin-bottom: 4px;
      }
      .gallery p {
        margin-top: 7px;
        font-size: 12px;
      }
      .gallery .switch {
        margin-left: auto;
      }
      .group-title {
        margin: 22px 0 12px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .group-title:first-child {
        margin-top: 0;
      }
      .group-title small {
        font-weight: 400;
        color: var(--muted);
        font-size: 11px;
      }
      .table-row {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      .table-row:last-child {
        border: 0;
      }
      .table-row .info {
        flex: 1;
      }
      .table-row .info small {
        color: var(--muted);
      }
      .table-row .type {
        color: var(--muted);
        font-size: 12px;
        width: 85px;
      }
      .table-card {
        padding: 0;
        overflow: hidden;
      }
      .page-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .page-tabs button.active {
        color: var(--accent);
        background: var(--soft);
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--card);
        color: var(--text);
        padding: 24px;
        width: min(520px, 90vw);
        box-shadow: var(--shadow);
      }
      dialog::backdrop {
        background: #14231d66;
        backdrop-filter: blur(4px);
      }
      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 16px;
      }
      dialog p {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.8;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 22px;
      }
      .drop-overlay {
        position: fixed;
        inset: 63px 16px 16px 88px;
        border: 2px dashed var(--accent);
        border-radius: 18px;
        background: var(--soft);
        z-index: 40;
        display: none;
        place-items: center;
        text-align: center;
        pointer-events: none;
      }
      .drop-overlay.visible {
        display: grid;
      }
      .drop-overlay h2 {
        font-size: 26px;
      }
      .catalog-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start !important;
      }
      .catalog-card .top {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .catalog-card button {
        margin-top: 16px;
      }
      .recycle-row {
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
      }
      .counter {
        font-size: 11px;
        color: var(--muted);
      }
      @media (min-width: 1500px) {
        .shell {
          grid-template-columns: 76px 310px minmax(0, 1fr);
        }
        .scroll {
          padding: 35px 42px 90px;
        }
        .detail-grid {
          grid-template-columns: minmax(0, 1fr) 275px;
        }
      }
      @media (max-width: 1000px) {
        .shell {
          grid-template-columns: 64px 250px minmax(0, 1fr);
        }
        .rail button {
          width: 52px;
        }
        .scroll {
          padding: 22px 20px 88px;
        }
        .detail-grid {
          grid-template-columns: 1fr;
        }
        .gallery {
          grid-template-columns: 1fr;
        }
        .hero {
          padding: 19px;
        }
        .hero-line {
          flex-wrap: wrap;
        }
        .hero-controls {
          margin-left: 0;
          width: 100%;
          justify-content: flex-end;
        }
        .main-head h1 {
          font-size: 24px;
        }
        .summary {
          display: none;
        }
        .switcher {
          left: calc(50% + 110px);
        }
        .preview-note {
          max-width: 40%;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
      }
      @media (max-width: 700px) {
        .shell {
          grid-template-columns: 54px 205px minmax(250px, 1fr);
        }
        .rail button {
          width: 44px;
          font-size: 10px;
        }
        .sidebar .filters button {
          padding: 4px 7px;
        }
        .tile {
          height: 30px;
          width: 30px;
        }
        .row {
          padding: 10px 7px;
          gap: 5px;
        }
        .row-select {
          gap: 7px;
        }
        .row-actions .remove {
          display: none !important;
        }
        .scroll {
          padding: 18px 14px 90px;

  </head>
  <body>
    <div class="titlebar">
      <span class="brand-icon" data-icon="box"></span
      ><span class="brand">Easy Craft</span><span class="muted small">扩展</span

    <dialog id="dialog"></dialog>
    <script>
      const paths = {

        puzzle:

      function icon(name) {

      function paintIcons(root = document) {

        String(s).replace(

      const items = [

      const catalog = [

          id: 'icons',

          author: 'Moss',
          official: false,
          color: '#e9eee0',
          ink: '#738452',
        },
        {
          id: 'world-tool',
          name: '存档书签',
          category: '功能',
          slot: null,
          icon: 'box',
          description: '给重要的世界留下书签，快速回到上次的冒险。',
          version: '1.1.0',
          author: 'Easy Craft',
          official: true,
          color: '#ede7df',
          ink: '#8b7358',
        },
        {
          id: 'theme-sand',
          name: '暖砂',
          category: '外观',
          slot: 'theme',
          icon: 'palette',
          description: '暖灰与浅砂色，为界面带来柔和的纸感。',
          version: '1.4.0',
          author: 'Papers',
          official: false,
          color: '#eee6dc',
          ink: '#a1825d',
        },
      ];
      const slotNames = {
        theme: '配色主题',
        layout: '工作区布局',
        font: '界面字体',
        icons: '图标包',
      };
      let selected = 'mint',
        filter = '全部',
        page = 'installed',
        variant =
          new URLSearchParams(location.search).get('variant') || 'detail',
        trash = [],
        pendingFiles = [];
      const byId = (id) => items.find((p) => p.id === id),
        tile = (p) =>
          `<span class="tile" style="--tile:${p.color || '#e6ede9'};--ink:${p.ink || '#47705c'}">${icon(p.icon)}</span>`,
        source = (p) =>
          p.official
            ? '<span class="badge official">官方</span>'
            : '<span class="badge">社区</span>';
      function toggle(p) {
        const before = items.map((x) => ({ id: x.id, enabled: x.enabled }));
        let replaced = [];
        p.enabled = !p.enabled;
        if (p.enabled && p.slot)
          items
            .filter((x) => x.id !== p.id && x.slot === p.slot && x.enabled)
            .forEach((x) => {
              x.enabled = false;
              replaced.push(x.name);
            });
        render();
        toast(
          p.enabled
            ? `已启用「${p.name}」${replaced.length ? '，已停用「' + replaced.join('、') + '」' : ''}`
            : `已停用「${p.name}」${p.slot ? '，使用默认' + slotNames[p.slot] : ''}`,
          () => {
            before.forEach((x) => {
              const item = byId(x.id);
              if (item) item.enabled = x.enabled;
            });
            render();
          },
        );
      }
      function toggleButton(p) {
        return `<button class="switch" role="switch" aria-label="启停 ${esc(p.name)}" aria-checked="${p.enabled}" data-toggle="${esc(p.id)}"></button>`;
      }
      function remove(p) {
        const index = items.indexOf(p);
        trash.push({ ...p, index });
        items.splice(index, 1);
        if (selected === p.id) selected = items[0]?.id || '';
        render();
        toast(
          `「${p.name}」已进入回收站${p.enabled && p.slot ? '，已恢复默认' + slotNames[p.slot] : ''}`,
          () => restore(p.id),
        );
      }
      function restore(id) {
        const i = trash.findIndex((x) => x.id === id);
        if (i < 0) return;
        const p = trash.splice(i, 1)[0];
        p.enabled = false;
        items.splice(Math.min(p.index, items.length), 0, p);
        selected = p.id;
        render();
        toast(`已恢复「${p.name}」，当前未启用`);
      }
      function toast(message, undo) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = icon('check') + `<span>${esc(message)}</span>`;
        if (undo) {
          const b = document.createElement('button');
          b.textContent = '撤销';
          b.onclick = () => {
            undo();
            el.remove();
          };
          el.append(b);
        }
        document.querySelector('#toasts').append(el);
        setTimeout(() => el.remove(), 6500);
      }
      function matches() {
        const q = document.querySelector('#search').value.toLowerCase();
        return items.filter(
          (p) =>
            (filter === '全部' || p.category === filter) &&
            `${p.name} ${p.author}`.toLowerCase().includes(q),
        );
      }
      function renderSidebar() {
        document.querySelector('#plugin-count').textContent = items.length;
        document.querySelector('#trash-count').textContent = trash.length;
        document.querySelector('#filters').innerHTML = [
          '全部',
          '外观',
          '布局',
          '功能',
        ]
          .map(
            (x) =>
              `<button class="${filter === x ? 'active' : ''}" data-filter="${x}">${x}</button>`,
          )
          .join('');
        document.querySelector('#plugin-list').innerHTML =
          matches()
            .map(
              (p) =>
                `<div class="row ${p.id === selected && page === 'installed' ? 'selected' : ''}"><button class="row-select" data-select="${esc(p.id)}" aria-label="查看 ${esc(p.name)}">${tile(p)}<span class="row-info"><span class="row-name" style="display:block">${esc(p.name)}</span><span class="row-meta" style="display:block">${esc(p.category)} · ${p.official ? '官方' : '社区'} · ${p.enabled ? '已启用' : '未启用'}</span></span></button><span class="row-actions">${toggleButton(p)}<button class="remove icon" data-remove="${esc(p.id)}" title="移入回收站" aria-label="删除 ${esc(p.name)}">${icon('trash')}</button></span></div>`,

            .join('') || '<div class="empty">没有匹配的插件</div>';

      }

          : '独立功能 · 可同时启用多个';
        const other =
          p.slot &&
          items.find((x) => x.slot === p.slot && x.enabled && x.id !== p.id);

          heading('我的插件', '按你的习惯，组合属于自己的 Easy Craft。') +

            '探索更多外观与工具。这里的下载只演示界面，不访问网络。',
          ) +
          `<div class="page-tabs"><button class="active" data-hint="预览展示示例插件">推荐</button><button data-hint="正式版会按分类浏览插件">分类浏览</button></div><div class="gallery">${catalog.map((p) => `<section class="card catalog-card"><div class="top">${tile(p)}<div><h3>${esc(p.name)}</h3><span class="muted small">${esc(p.author)} · ${esc(p.version)}</span></div>${source(p)}</div><p>${esc(p.description)}</p><button class="${byId(p.id) ? '' : 'primary'}" data-install="${p.id}" ${byId(p.id) ? 'disabled' : ''}>${icon(byId(p.id) ? 'check' : 'download')}${byId(p.id) ? '已安装' : '演示下载'}</button></section>`).join('')}</div><div class="slot-note">下载与本地导入采用相同规则：先安装，再由你启用；不会悄悄替换当前主题。</div>`
        );
      }
      function render() {
        renderSidebar();
        document.querySelector('#crumb').textContent =
          page === 'catalog' ? '下载插件' : '我的插件';
        document.querySelector('#content').innerHTML =
          page === 'catalog'
            ? catalogView()
            : variant === 'groups'
              ? groupsView()
              : variant === 'table'
                ? tableView()
                : detailView(byId(selected));
        document
          .querySelectorAll('[data-variant]')
          .forEach((b) =>
            b.classList.toggle('active', b.dataset.variant === variant),
          );
        paintIcons();
      }
      function openDialog(html) {
        const d = document.querySelector('#dialog');
        d.innerHTML = html;
        paintIcons(d);
        if (!d.open) d.showModal();
      }
      function closeDialog() {
        document.querySelector('#dialog').close();
      }
      function recycleView() {
        openDialog(
          `<div class="dialog-head"><h2>插件回收站 <span class="badge">预览</span></h2><button class="icon ghost" data-close aria-label="关闭">${icon('close')}</button></div><p>在这里恢复已删除的插件。此演示不会操作 Windows 回收站或删除真实文件。</p>${trash.length ? trash.map((p) => `<div class="recycle-row"><div><strong>${esc(p.name)}</strong><div class="muted small">${esc(p.version)} · 恢复后不自动启用</div></div><button data-restore="${esc(p.id)}">恢复</button></div>`).join('') : '<div class="empty">回收站是空的</div>'}`,
        );
      }
      async function readFiles(files) {
        try {
          pendingFiles = [];
          for (const file of files) {
            if (file.size > 131072)
              throw Error('预览支持 128 KiB 以内的 JSON 配置包');
            const p = JSON.parse(await file.text());
            if (
              !p ||
              typeof p.id !== 'string' ||
              !/^[a-z0-9][a-z0-9.-]{2,79}$/i.test(p.id) ||
              typeof p.name !== 'string' ||
              !p.name.trim() ||
              p.name.length > 80 ||
              !['theme', 'layout', 'feature'].includes(p.type)
            )
              throw Error('请选择含 id、name、type 的插件 JSON 包');
            if (byId(p.id) || pendingFiles.some((x) => x.id === p.id))
              throw Error('插件已安装：' + p.name);
            pendingFiles.push({
              id: p.id,
              name: p.name,
              category:
                p.type === 'layout'
                  ? '布局'
                  : p.type === 'theme'
                    ? '外观'
                    : '功能',
              slot:
                p.type === 'feature'
                  ? null
                  : p.type === 'theme'
                    ? 'theme'
                    : 'layout',
              version: typeof p.version === 'string' ? p.version : '1.0.0',
              author: '本地导入',
              official: false,
              enabled: false,
              icon:
                p.type === 'theme'
                  ? 'palette'
                  : p.type === 'layout'
                    ? 'layout'
                    : 'puzzle',
              description:
                typeof p.description === 'string'
                  ? p.description
                  : '从本地文件导入的预览插件。',
            });
          }
          openDialog(
            `<div class="dialog-head"><h2>导入本地插件</h2><button class="icon ghost" data-close aria-label="关闭">${icon('close')}</button></div>${pendingFiles.map((p) => `<div class="recycle-row">${tile(p)}<div style="flex:1"><strong>${esc(p.name)}</strong><div class="muted small">${esc(p.category)} · ${esc(p.version)} · 本地</div></div><span class="badge">待安装</span></div>`).join('')}<p style="margin-top:17px">导入到此预览页面，不执行代码，也不会修改正在使用的主题。</p><div class="dialog-actions"><button data-close>取消</button><button class="primary" id="confirm-import">确认导入</button></div>`,
          );
        } catch (e) {
          toast(e.message || '文件无法读取');
        }
      }
      document.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        const d = b.dataset;
        if (d.toggle) {
          const p = byId(d.toggle);
          if (p) toggle(p);
        } else if (d.remove) {
          const p = byId(d.remove);
          if (p) remove(p);
        } else if (d.select) {
          selected = d.select;
          page = 'installed';
          variant = 'detail';
          render();
        } else if (d.filter) {
          filter = d.filter;
          render();
        } else if (d.variant) {
          variant = d.variant;
          page = 'installed';
          const u = new URL(location);
          u.searchParams.set('variant', variant);
          history.replaceState({}, '', u);
          render();
        } else if (d.restore) {
          restore(d.restore);
          recycleView();
        } else if (d.close !== undefined) closeDialog();
        else if (d.catalog !== undefined || b.id === 'browse') {
          page = 'catalog';
          render();
        } else if (d.install) {
          const p = catalog.find((p) => p.id === d.install);
          if (p && !byId(p.id)) {
            b.disabled = true;
            b.textContent = '演示下载中…';
            setTimeout(() => {
              items.push({ ...p, enabled: false });
              render();
              toast(`「${p.name}」已安装，尚未启用`);
            }, 700);
          }
        } else if (d.hint) toast(d.hint);
        else if (b.id === 'add')
          openDialog(
            `<div class="dialog-head"><h2>添加插件</h2><button class="icon ghost" data-close aria-label="关闭">${icon('close')}</button></div><div class="dialog-actions" style="justify-content:stretch"><button class="primary" id="add-download">${icon('download')}下载插件</button><button id="add-import">${icon('folder')}从本地导入</button></div><p style="margin-top:17px">也可以把插件 JSON 文件拖进窗口。</p>`,
          );
        else if (b.id === 'import' || b.id === 'add-import') {
          closeDialog();
          document.querySelector('#file').click();
        } else if (b.id === 'add-download') {
          closeDialog();
          page = 'catalog';
          render();
        } else if (b.id === 'theme') document.body.classList.toggle('dark');
        else if (b.id === 'recycle') recycleView();
        else if (b.id === 'rail-extension') {
          page = 'installed';
          render();
        } else if (b.id === 'confirm-import') {
          items.push(...pendingFiles);
          selected = pendingFiles[0]?.id || selected;
          pendingFiles = [];
          page = 'installed';
          filter = '全部';
          document.querySelector('#search').value = '';
          closeDialog();
          render();
          toast('插件已导入，尚未启用');
        }
      });
      document.querySelector('#search').addEventListener('input', render);
      document.querySelector('#file').onchange = (e) => {
        if (e.target.files.length) readFiles([...e.target.files]);
        e.target.value = '';
      };
      let dragDepth = 0;
      document.addEventListener('dragenter', (e) => {
        if (e.dataTransfer.types.includes('Files')) {
          e.preventDefault();
          dragDepth++;
          document.querySelector('#drop').classList.add('visible');
        }
      });
      document.addEventListener('dragover', (e) => {
        if (e.dataTransfer.types.includes('Files')) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'copy';
        }
      });
      document.addEventListener('dragleave', () => {
        if (--dragDepth <= 0) {
          dragDepth = 0;
          document.querySelector('#drop').classList.remove('visible');
        }
      });
      document.addEventListener('drop', (e) => {
        e.preventDefault();
        dragDepth = 0;
        document.querySelector('#drop').classList.remove('visible');
        if (e.dataTransfer.files.length) readFiles([...e.dataTransfer.files]);
      });
      render();
    </script>
  </body>
</html>
