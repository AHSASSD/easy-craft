<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Easy Craft · 三入口双栏设计预览</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px 'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        background: #e5e9e3;
        color: #25312a;
        padding: 22px;
      }
      body.dark {
        background: #101613;
        color: #e3eae4;
        --bg: #19201c;
        --panel: #202923;
        --card: #26312a;
        --line: #3a473d;
        --muted: #a4b3a7;
        --selected: #324b33;
        --ink: #e3eae4;
      }
      body {
        --bg: #f2f4f1;
        --panel: #f9faf8;
        --card: #fff;
        --line: #dfe5dc;
        --muted: #738071;
        --selected: #e5f0df;
        --ink: #25312a;
      }
      .preface {
        max-width: 1240px;
        margin: 0 auto 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .preface b {
        color: var(--ink);
      }
      .window {
        max-width: 1240px;
        height: min(790px, calc(100vh - 80px));
        min-height: 510px;
        margin: auto;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 18px 65px #2b3c2520;
        display: flex;
        flex-direction: column;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 8px;
        padding: 9px 13px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      button:hover {
        filter: brightness(0.97);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid #468f3c;
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .titlebar {
        height: 48px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        padding: 0 19px;
        gap: 10px;
        background: var(--card);
      }
      .titlebar svg {
        color: #459441;
      }
      .titlebar strong {
        font-size: 17px;
      }
      .titlebar small {
        color: var(--muted);
        font-size: 11px;
      }
      .window-controls {
        margin-left: auto;
        display: flex;
        gap: 25px;
        color: var(--muted);
      }
      .layout {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: var(--left, 280px) 7px minmax(0, 1fr);
      }
      aside {
        background: var(--panel);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      nav {
        padding: 14px 13px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
        border-bottom: 1px solid var(--line);
      }
      nav button {
        border: 0;
        background: transparent;
        color: var(--muted);
        flex-direction: column;
        font-size: 12px;
        padding: 12px 0;
        gap: 8px;
      }
      nav button.selected {
        background: #3f933f;
        color: #fff;
        box-shadow: 0 4px 10px #357b3323;
      }
      .left-body {
        padding: 19px 13px;
        flex: 1;
        overflow: auto;
        min-height: 0;
      }
      .left-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 3px 17px;
      }
      .left-title h2 {
        font-size: 14px;
        margin: 0;
      }
      .left-title small {
        color: var(--muted);
        font-weight: normal;
        margin-left: 5px;
      }
      .small-action {
        padding: 3px 7px;
        font-size: 17px;
      }
      .left-item {
        width: 100%;
        justify-content: flex-start;
        text-align: left;
        border-color: transparent;
        background: transparent;
        padding: 13px 11px;
        margin-bottom: 7px;
        position: relative;
        min-height: 50px;
      }
      .left-item.selected {
        background: var(--selected);
        border-color: #74a35b30;
      }
      .left-item[hidden] {
        display: none;
      }
      .left-item.selected:before {
        content: '';
        position: absolute;
        left: 0;
        top: 12px;
        bottom: 12px;
        width: 3px;
        background: #4b993d;
        border-radius: 3px;
      }
      .left-item strong {
        font-size: 13px;
        display: block;
      }
      .left-item small {
        font-size: 11px;
        color: var(--muted);
        display: block;
        margin-top: 5px;
      }
      .block {
        display: grid;
        place-items: center;
        width: 37px;
        height: 37px;
        border-radius: 8px;
        background: linear-gradient(
          145deg,
          #86ab4e 0 42%,
          #668448 42% 55%,
          #94714e 55%
        );
        color: #f3f6d7;
        margin-right: 3px;
      }
      .block.stone {
        background: linear-gradient(
          145deg,
          #9aa29b 0 42%,
          #768779 42% 55%,
          #65766c 55%
        );
      }
      .left-tip {
        font-size: 11px;
        line-height: 1.8;
        color: var(--muted);
        padding: 10px 9px;
      }
      .left-tools {
        padding: 0 15px 14px;
      }
      .left-tools input {
        width: 100%;
        background: var(--bg);
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 12px;
      }
      .drop {
        margin-top: 10px;
        padding: 13px;
        border: 1px dashed #93b18a;
        background: var(--selected);
        border-radius: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .drop b {
        color: var(--ink);
        display: block;
        font-size: 12px;
        margin-bottom: 3px;
      }
      .account {
        padding: 15px 17px;
        border: 0;
        border-top: 1px solid var(--line);
        border-radius: 0;
        justify-content: flex-start;
        background: var(--panel);
        width: 100%;
        text-align: left;
      }
      .account span:nth-child(2) {
        flex: 1;
      }
      .account strong {
        display: block;
        font-size: 13px;
      }
      .account small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 5px;
      }
      .face {
        width: 39px;
        height: 39px;
        border-radius: 6px;
        image-rendering: pixelated;
        overflow: hidden;
        flex-shrink: 0;
      }
      .face svg {
        width: 39px;
        height: 39px;
        stroke: none;
      }
      .divider {
        cursor: col-resize;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: #9ba995;
        font-size: 17px;
      }
      .divider:hover {
        background: var(--selected);
      }
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--bg);
      }
      .content {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }
      .crumb {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 17px 23px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .crumb b {
        color: var(--ink);
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 2px;
        color: #68a853;
        font-weight: 600;
      }
      .hero {
        background:
          linear-gradient(90deg, #173e2bce, #24472e30),
          url('../../src/assets/landscape.svg') center 45% / cover;
        padding: 24px 27px;
        min-height: 211px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: white;
      }
      .hero .hero-top {
        font-size: 10px;
        letter-spacing: 3px;
        color: #d7e4cd;
      }
      .hero-bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 15px;
      }
      .hero h1 {
        font-size: 27px;
        margin: 7px 0 13px;
        letter-spacing: -0.5px;
      }
      .hero p {
        font-size: 11px;
        margin: 0;
        color: #d3e0cf;
      }
      .chips {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .chips span {
        border: 1px solid #ffffff28;
        background: #ffffff13;
        padding: 5px 9px;
        border-radius: 6px;
        font-size: 10px;
      }
      .primary {
        background: #45983e;
        border-color: #45983e;
        color: white;
        font-weight: 600;
      }
      .launch {
        padding: 15px 24px;
        font-size: 16px;
        min-width: 155px;
        background: linear-gradient(140deg, #62b846, #3c8d35);
        border-color: #70b459;
        box-shadow: 0 6px 17px #17371935;
        color: white;
      }
      .tabs {
        display: flex;
        gap: 25px;
        padding: 0 23px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
        overflow: auto;
        white-space: nowrap;
      }
      .tabs button {
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: 15px 0;
        font-size: 12px;
        color: var(--muted);
      }
      .tabs button.selected {
        border-bottom: 3px solid #4b963d;
        color: #3f8e39;
        font-weight: 600;
      }
      .page {
        padding: 23px;
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(220px, 1fr);
        gap: 17px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 19px;
        margin-bottom: 16px;
      }
      .card h3 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      .card p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.9;
        margin: 0 0 15px;
      }
      .tagline {
        display: flex;
        gap: 7px;
      }
      .tagline span {
        font-size: 10px;
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 5px 10px;
      }
      .quick {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .quick button {
        font-size: 11px;
        padding: 8px 10px;
      }
      .facts {
        display: grid;
        grid-template-columns: 84px minmax(0, 1fr);
        gap: 13px;
        font-size: 11px;
      }
      .facts dt {
        color: var(--muted);
      }
      .facts dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
      }
      .heading h1 {
        font-size: 23px;
        margin: 6px 0;
      }
      .heading p {
        color: var(--muted);
        font-size: 12px;
        margin: 8px 0 0;
      }
      .notice {
        padding: 12px 14px;
        background: var(--selected);
        border: 1px solid #89b27a45;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.8;
        border-radius: 8px;
        margin-bottom: 18px;
      }
      .form-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .form-row:last-child {
        border-bottom: 0;
      }
      .form-row small {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
      }
      .form-row input[type='text'],
      select {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px;
        max-width: 245px;
        font-size: 12px;
      }
      .form-row input[type='range'] {
        accent-color: #4c963e;
        max-width: 170px;
      }
      .form-row input[type='checkbox'] {
        accent-color: #4c963e;
        width: 17px;
        height: 17px;
      }
      .section-note {
        font-size: 11px;
        color: var(--muted);
        margin: 12px 0;
      }
      .footer-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: var(--muted);
      }
      .target {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 15px;
        background: var(--selected);
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 17px;
        font-size: 12px;
      }
      .target small {
        font-size: 10px;
        color: var(--muted);
        margin-left: auto;
      }
      .filters {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .filters input {
        flex: 1;
        min-width: 140px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: var(--card);
        font-size: 12px;
      }
      .resource {
        display: flex;
        gap: 15px;
        align-items: center;
      }
      .resource-icon {
        width: 45px;
        height: 45px;
        border: 1px solid var(--line);
        background: var(--selected);
        border-radius: 11px;
        display: grid;
        place-items: center;
        color: #558749;
        font-size: 20px;
        flex-shrink: 0;
      }
      .resource-text {
        flex: 1;
      }
      .resource h3 {
        margin-bottom: 6px;
      }
      .resource p {
        margin: 0 0 7px;
        font-size: 11px;
      }
      .resource small {
        font-size: 10px;
        color: var(--muted);
      }
      .taskbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--panel);
        border-top: 1px solid var(--line);
        padding: 10px 20px;
        font-size: 11px;
        color: var(--muted);
      }
      .taskbar span {
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .taskbar i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #6fa95c;
      }
      .taskbar button {
        padding: 5px 9px;
        font-size: 10px;
        background: transparent;
      }
      .preview-label {
        color: #7b8d72;
        font-size: 10px;
        letter-spacing: 1px;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 20px;
        background: #26372bf0;
        color: white;
        border-radius: 10px;
        font-size: 12px;
        box-shadow: 0 5px 30px #0002;
        z-index: 5;
      }
      dialog {
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 25px;
        max-width: 430px;
      }
      dialog::backdrop {
        background: #12241870;
      }
      dialog h2 {
        font-size: 18px;
      }
      dialog p {
        line-height: 1.8;
        color: var(--muted);
        font-size: 12px;
      }
      a {
        color: #43873c;
      }
      body.dark .tabs button.selected {
        color: #9acc8d;
      }
      @media (max-width: 950px) {
        body {
          padding: 10px;
        }
        .window {
          height: calc(100vh - 56px);
        }
        .layout {
          grid-template-columns: 240px 7px minmax(0, 1fr);
        }
        .columns {
          grid-template-columns: 1fr;
        }
        .hero {
          padding: 21px;
          min-height: 190px;
        }
        .hero h1 {
          font-size: 22px;
        }
        .launch {
          min-width: 115px;
          padding: 13px;
        }
        .page {
          padding: 18px;
        }
        .tabs {
          gap: 16px;
        }
        .form-row {
          gap: 10px;
        }
        .form-row input[type='text'] {
          max-width: 160px;
        }
        .target {
          flex-wrap: wrap;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        button {
          transition: background 0.14s;
        }
      }
    </style>
  </head>
  <body>
    <div class="preface">
      <span><b>Easy Craft · 导航设计预览</b>　示例数据 · 不连接游戏服务</span
      ><button id="theme" style="padding: 5px 10px; font-size: 11px">
        切换深浅色
      </button>
    </div>
    <div class="window">
      <header class="titlebar">
        <svg viewBox="0 0 24 24">
          <path d="m12 2 10 5v10l-10 5L2 17V7zM2 7l10 5 10-5M12 12v10" /></svg
        ><strong>Easy Craft</strong><small>UI DESIGN / 方案预览</small>
        <div class="window-controls" aria-label="窗口按钮示意">
          <span>─</span><span>□</span><span>×</span>
        </div>
      </header>
      <div class="layout">
        <aside>
          <nav aria-label="主入口">
            <button data-section="library" class="selected">
              <svg viewBox="0 0 24 24">
                <path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10" /></svg
              >游戏库
            </button>
            <button data-section="settings">
              <svg viewBox="0 0 24 24">
                <path
                  d="m9 3 1-2h4l1 2 3 2 2 1v4l-2 2-1 3 1 3-3 2-3-1-3 1-3-2 1-3-1-3-2-2V6l2-1z"
                  transform="translate(1 1) scale(.9)"
                />
                <circle cx="12" cy="11" r="3" /></svg
              >设置
            </button>
            <button data-section="download">
              <svg viewBox="0 0 24 24">
                <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" /></svg
              >下载
            </button>
          </nav>
          <div class="left-body" id="left"></div>
          <div class="left-tools" id="tools"></div>
          <button class="account" id="account">
            <span class="face"
              ><svg viewBox="0 0 8 8">
                <path fill="#bd8a62" d="M0 0h8v8H0z" />
                <path
                  fill="#59402b"
                  d="M0 0h8v2H0zM0 2h1v1H0zm7 0h1v2H7zM2 6h4v1H2z"
                />
                <path fill="#e0d6c4" d="M1 4h2v1H1zm4 0h2v1H5z" />
                <path fill="#476783" d="M2 4h1v1H2zm3 0h1v1H5z" /></svg></span
            ><span
              ><strong>EasyPlayer</strong
              ><small>离线账户 · 示例皮肤头像</small></span
            ><span>⌄</span>
          </button>
        </aside>
        <div
          class="divider"
          role="separator"
          aria-label="调整左栏宽度"
          tabindex="0"
          aria-orientation="vertical"
          aria-valuenow="280"
          aria-valuemin="240"
          aria-valuemax="420"
        >
          ⋮
        </div>
        <main>
          <div class="content" id="content"></div>
          <footer class="taskbar">
            <span
              ><i></i>没有正在进行的任务
              <span class="preview-label">／ 设计示例</span></span
            ><button
              data-demo="任务抽屉将统一展示下载、启动和日志；当前没有真实任务。"
            >
              查看任务 ↗
            </button>
          </footer>
        </main>
      </div>
    </div>
    <dialog id="account-dialog">
      <h2>账户入口</h2>
      <p>
        这里固定在左下角。实际应用继续读取玩家使用的皮肤头像，支持正版 /
        离线身份。本预览不发起认证，也不保存账户。
      </p>
      <div class="quick">
        <button disabled>Microsoft 正版登录</button
        ><button disabled>离线登录</button
        ><button id="close-dialog">关闭</button>
      </div>
    </dialog>
    <script>
      const games = [
        {
          name: '山间生存',
          version: '1.21.1',
          loader: 'Fabric',
          java: '21',
          kind: 'grass',
        },
        {
          name: '纯净原版',
          version: '1.21.1',
          loader: '原版',
          java: '21',
          kind: 'stone',
        },
        {
          name: '建筑计划',
          version: '1.20.1',
          loader: 'Fabric',
          java: '17',
          kind: 'grass',
        },
      ];
      const settings = ['启动', '个性化', '下载设置', '其他'];
      const downloads = [
        '原版游戏',
        '模组',
        '光影包',
        '整合包',
        '数据包',
        '资源包',
      ];
      const tabs = ['概览', '模组', '资源与光影', '存档', '截图', '实例设置'];
      const state = {
        section: 'library',
        game: 0,
        settings: 0,
        download: 0,
        tab: 0,
        query: '',
        scroll: {},
      };
      const left = document.querySelector('#left'),
        tools = document.querySelector('#tools'),
        content = document.querySelector('#content');
      const icon =
        '<svg viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/></svg>';
      const notice =
        '<div class="notice">方案预览：下方为示例内容，用于说明布局与操作位置；功能是否已实现以设计文档为准。</div>';
      function crumb(text) {
        return (
          '<div class="crumb"><span>Easy Craft　/　' +
          text +
          '</span><span class="preview-label">设计示例</span></div>'
        );
      }
      function demo(label, text) {
        return '<button data-demo="' + text + '">' + label + '</button>';
      }
      function row(title, description, control) {
        return (
          '<div class="form-row"><span>' +
          title +
          '<small>' +
          description +
          '</small></span>' +
          control +
          '</div>'
        );
      }
      function choose(section) {
        state.scroll[state.section] = content.scrollTop;
        state.section = section;
        render();
        content.scrollTop = state.scroll[section] || 0;
      }
      function renderLeft() {
        document.querySelectorAll('[data-section]').forEach((button) => {
          button.classList.toggle(
            'selected',
            button.dataset.section === state.section,
          );
          button.setAttribute(
            'aria-pressed',
            String(button.dataset.section === state.section),
          );
        });
        if (state.section === 'library') {
          left.innerHTML =
            '<div class="left-title"><h2>我的游戏 <small>3</small></h2><button class="small-action" aria-label="新建示意" data-demo="新建实例将引导到下载 → 原版游戏，也可检查本地整合包。">+</button></div>' +
            games
              .map(
                (g, i) =>
                  '<button class="left-item ' +
                  (state.game === i ? 'selected' : '') +
                  '" data-game="' +
                  i +
                  '" ' +
                  (g.name.includes(state.query) ||
                  g.version.includes(state.query)
                    ? ''
                    : 'hidden') +
                  '><span class="block ' +
                  (g.kind === 'stone' ? 'stone' : '') +
                  '">' +
                  icon +
                  '</span><span><strong>' +
                  g.name +
                  '</strong><small>' +
                  g.version +
                  ' · ' +
                  g.loader +
                  '</small></span></button>',
              )
              .join('');
          tools.innerHTML =
            '<input id="search-games" aria-label="搜索示例实例" placeholder="搜索实例名称或版本…"><div class="drop"><b>拖入 ZIP / MRPACK</b>先检查内容，再预览导入变更</div>';
          const search = document.querySelector('#search-games');
          search.value = state.query;
          search.oninput = () => {
            state.query = search.value;
            document.querySelectorAll('[data-game]').forEach((button) => {
              const g = games[Number(button.dataset.game)];
              button.hidden = !(
                g.name.includes(state.query) || g.version.includes(state.query)
              );
            });
          };
        } else {
          const isSettings = state.section === 'settings',
            items = isSettings ? settings : downloads,
            index = isSettings ? state.settings : state.download;
          left.innerHTML =
            '<div class="left-title"><h2>' +
            (isSettings ? '设置' : '下载内容') +
            '</h2></div>' +
            items
              .map(
                (item, i) =>
                  '<button class="left-item ' +
                  (index === i ? 'selected' : '') +
                  '" data-category="' +
                  i +
                  '"><span aria-hidden="true" style="color:#619353;width:22px;text-align:center">' +
                  (isSettings
                    ? ['⚙', '◐', '↓', '⋯'][i]
                    : ['▣', '◇', '☀', '▤', '▧', '▦'][i]) +
                  '</span><strong>' +
                  item +
                  '</strong></button>',
              )
              .join('') +
            '<p class="left-tip">' +
            (isSettings
              ? '全局设置作用于之后的启动。<br>实例自己的配置在游戏库中调整。'
              : '安装资源前明确目标实例。<br>数据包还需要选择目标世界。') +
            '</p>';
          tools.innerHTML =
            '<div class="left-tip">' +
            (isSettings
              ? '保留每个入口上次的位置'
              : '下载在后台继续，随时可以切回游戏库') +
            '</div>';
        }
      }
      function library() {
        const g = games[state.game];
        let body = '';
        if (state.tab === 0)
          body =
            '<div class="columns"><div><section class="card"><h3>属于你的独立世界</h3><p>在这里查看实例内容和运行环境。存档、模组与资源各自管理，进入游戏前就把需要的设置准备好。</p><div class="tagline"><span>独立目录</span><span>真实本地内容</span><span>配置可备份</span></div></section><section class="card"><h3>快速操作</h3><div class="quick">' +
            demo('打开游戏目录', '正式功能只打开所选实例的受控目录。') +
            '<button data-tab="3">调整世界设置</button><button data-section-link="download">获取资源 ↗</button></div></section></div><section class="card"><h3>启动环境</h3><dl class="facts"><dt>游戏版本</dt><dd>' +
            g.version +
            '</dd><dt>加载器</dt><dd>' +
            g.loader +
            '</dd><dt>Java</dt><dd>Java ' +
            g.java +
            ' · 64 位</dd><dt>内存分配</dt><dd>自动 · 继承全局设置</dd><dt>启动身份</dt><dd>EasyPlayer · 离线</dd></dl><p style="margin:16px 0 0">这是示例实例；正式界面只显示实际读取的环境与状态。</p></section></div>';
        else if (state.tab === 3)
          body =
            '<div class="heading"><div><div class="eyebrow">WORLDS</div><h1>管理这个实例的世界</h1><p>选择世界后修改难度、游戏规则与数据包。</p></div></div><div class="columns"><section class="card"><h3>山间的小屋 <small style="color:var(--muted)">· 示例世界</small></h3><p>生存 · 普通难度</p><div class="quick">' +
            demo(
              '世界设置',
              '现有世界编辑能力会接在这里，保留备份与占用检查。',
            ) +
            demo(
              '数据包',
              '选择世界 → 下载数据包 → 预览变更 → 安装到该世界。',
            ) +
            '</div></section><section class="card"><h3>保存前自动备份</h3><p>先退出游戏再保存。音量和渲染距离属于整个实例，在“实例设置”中调整。</p></section></div>';
        else
          body =
            '<section class="card"><h3>' +
            tabs[state.tab] +
            '</h3><p>这里管理“' +
            g.name +
            '”的' +
            tabs[state.tab] +
            '。实际内容来自该实例目录；尚未实现的能力分阶段接入。</p>' +
            demo('查看操作说明', '此页仅演示标签布局，未连接目录或修改服务。') +
            '</section>';
        content.innerHTML =
          crumb('游戏库　/　<b>' + g.name + '</b>') +
          '<section class="hero"><div class="hero-top">YOUR WORLD, YOUR WAY</div><div class="hero-bottom"><div><p>下一次冒险，由你设定</p><h1>' +
          g.name +
          '</h1><div class="chips"><span>Minecraft ' +
          g.version +
          '</span><span>' +
          g.loader +
          '</span><span>Java ' +
          g.java +
          '</span></div></div><button class="launch" data-demo="本页是设计预览，不启动游戏。正式版将复用现有真实启动服务。">▶　启动游戏</button></div></section><div class="tabs" role="tablist" aria-label="实例标签">' +
          tabs
            .map(
              (tab, i) =>
                '<button role="tab" aria-selected="' +
                (state.tab === i) +
                '" class="' +
                (state.tab === i ? 'selected' : '') +
                '" data-tab="' +
                i +
                '">' +
                tab +
                '</button>',
            )
            .join('') +
          '</div><div class="page">' +
          body +
          '</div>';
      }
      function settingsPage() {
        const category = settings[state.settings];
        let body = '';
        if (state.settings === 0)
          body =
            '<section class="card"><h3>Java 运行环境</h3>' +
            row(
              '默认 Java',
              '实例可使用独立覆盖；仅在下一次启动生效',
              '<select aria-label="示例 Java"><option>Java 21 · 64 位</option><option>Java 17 · 64 位</option></select>',
            ) +
            row(
              '环境检查',
              '启动前验证版本与架构',
              demo('检测 Java', '正式版复用已有原生 Java 检测；此处仅预览。'),
            ) +
            '</section><section class="card"><h3>内存与启动</h3>' +
            row(
              '内存分配',
              '优先为系统预留可用内存',
              '<select aria-label="示例内存方式"><option>自动分配（推荐）</option><option>手动分配</option></select>',
            ) +
            row(
              '启动前内存整理',
              '默认关闭；可能导致短暂卡顿',
              '<input aria-label="示例内存整理" type="checkbox">',
            ) +
            row(
              '双击实例启动',
              '默认关闭，防止误触',
              '<input aria-label="示例双击启动" type="checkbox">',
            ) +
            '</section>';
        if (state.settings === 1)
          body =
            '<section class="card"><h3>外观</h3>' +
            row(
              '主题',
              '草方块亮色 / 深板岩暗色',
              '<button id="theme-inner">切换主题预览</button>',
            ) +
            row(
              '游戏页背景',
              '本地图片，不覆盖设置页正文',
              demo(
                '选择背景',
                '正式版保存到受控素材目录；预览不读取本地文件。',
              ),
            ) +
            row(
              '减少动态效果',
              '尊重系统减少动态效果偏好',
              '<input aria-label="示例减少动态效果" type="checkbox" checked>',
            ) +
            '</section>';
        if (state.settings === 2)
          body =
            '<section class="card"><h3>下载与缓存</h3>' +
            row(
              '并发任务',
              '后端支持后才开放可配置上限',
              '<select disabled><option>沿用当前下载策略</option></select>',
            ) +
            row(
              '缓存管理',
              '只清理受控缓存，不删除世界存档',
              demo('检查缓存', '正式版需要缓存检查与安全清理服务。'),
            ) +
            '<p style="margin-top:16px">资源检索位于顶部“下载”入口，这里只调整行为。</p></section>';
        if (state.settings === 3)
          body =
            '<section class="card"><h3>关于 Easy Craft</h3><p>独立的 Minecraft 启动器。诊断、数据位置、演示入口集中在这里；不在常用页面堆积开发选项。</p><div class="quick">' +
            demo('打开诊断', '正式版展示脱敏诊断和日志。') +
            demo('查看数据位置', '正式版显示实际数据目录。') +
            '</div></section>';
        content.innerHTML =
          crumb('设置　/　<b>' + category + '</b>') +
          '<div class="page"><div class="heading"><div><div class="eyebrow">PREFERENCES</div><h1>' +
          category +
          '设置</h1><p>常用选项在前，高级参数按需展开。</p></div><span class="tagline"><span>全局默认</span></span></div>' +
          notice +
          body +
          '<div class="footer-actions"><span>预览中的设置不会写入应用</span><button class="primary" data-demo="这是布局预览，尚未保存任何设置。">保存设置</button></div></div>';
      }
      function downloadPage() {
        const name = downloads[state.download],
          g = games[state.game],
          isGame = state.download === 0;
        const examples = isGame
          ? [
              [
                '1.21.1',
                '正式版 · 示例版本条目',
                '选择游戏版本后设置实例名称、加载器和环境。',
              ],
              [
                '1.20.1',
                '正式版 · 示例版本条目',
                '是否支持以正式版实际元数据和测试矩阵为准。',
              ],
            ]
          : [
              [
                '示例' + name + '项目 A',
                '示例作者 · 版本与文件信息',
                '这里显示资源简介和兼容条件，不使用虚假下载量。',
              ],
              [
                '示例' + name + '项目 B',
                '示例作者 · 版本与文件信息',
                '查看详情后，再选择兼容文件和安装目标。',
              ],
            ];
        content.innerHTML =
          crumb('下载　/　<b>' + name + '</b>') +
          '<div class="page"><div class="heading"><div><div class="eyebrow">DISCOVER / ' +
          (isGame ? 'MINECRAFT' : 'CONTENT') +
          '</div><h1>' +
          name +
          '</h1><p>' +
          (isGame
            ? '选择一个游戏版本，建立你的独立实例。'
            : '先找到合适的资源，再安装到明确的目标。') +
          '</p></div></div>' +
          notice +
          '<div class="target"><b>' +
          (isGame ? '安装方式：新建独立实例' : '安装到：' + g.name) +
          '</b><small>' +
          (isGame ? '原版 / 已支持的加载器' : g.version + ' · ' + g.loader) +
          '</small>' +
          (!isGame
            ? demo('更换目标', '正式版会列出实际兼容实例，数据包还需指定世界。')
            : '') +
          '</div>' +
          (state.download === 4
            ? '<div class="target">目标世界：山间的小屋（示例）<small>数据包属于世界，不属于实例全局</small></div>'
            : '') +
          '<div class="filters"><input aria-label="搜索资源示意" placeholder="' +
          (isGame ? '搜索游戏版本…' : '搜索' + name + '名称…') +
          '"><select aria-label="筛选示意"><option>' +
          (isGame ? '正式版' : '兼容当前实例') +
          '</option><option>' +
          (isGame ? '快照 / 历史版（规划）' : '查看全部（规划）') +
          '</option></select><button data-demo="预览不调用资源 API，不执行搜索。">搜索</button></div>' +
          examples
            .map(
              (item, i) =>
                '<section class="card resource"><div class="resource-icon">' +
                (isGame ? '▣' : ['◇', '☀', '▤', '▧', '▦'][state.download - 1]) +
                '</div><div class="resource-text"><h3>' +
                item[0] +
                '</h3><p>' +
                item[2] +
                '</p><small>' +
                item[1] +
                '</small></div><button data-demo="正式流程：详情 → 文件版本 → 安装目标 → 依赖与变更预览 → 安装。当前没有下载。">' +
                (isGame ? '选择版本' : '查看详情') +
                '</button></section>',
            )
            .join('') +
          '<p class="section-note">在线资源优先接入 Modrinth；未接通的类别在正式软件中明确标注，不提供假安装。</p></div>';
      }
      function render() {
        renderLeft();
        if (state.section === 'library') library();
        else if (state.section === 'settings') settingsPage();
        else downloadPage();
      }
      function toast(message) {
        document.querySelector('.toast')?.remove();
        const el = document.createElement('div');
        el.className = 'toast';
        el.setAttribute('role', 'status');
        el.textContent = message;
        document.body.append(el);
        setTimeout(() => el.remove(), 4200);
      }
      document.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.section) choose(button.dataset.section);
        if (button.dataset.sectionLink) choose(button.dataset.sectionLink);
        if (button.dataset.game !== undefined) {
          state.game = Number(button.dataset.game);
          state.tab = 0;
          render();
          content.scrollTop = 0;
        }
        if (button.dataset.category !== undefined) {
          state[state.section === 'settings' ? 'settings' : 'download'] =
            Number(button.dataset.category);
          render();
          content.scrollTop = 0;
        }
        if (button.dataset.tab !== undefined) {
          state.tab = Number(button.dataset.tab);
          library();
        }
        if (button.dataset.demo) toast(button.dataset.demo);
        if (button.id === 'theme' || button.id === 'theme-inner')
          document.body.classList.toggle('dark');
      });
      document.querySelector('#account').onclick = () =>
        document.querySelector('dialog').showModal();
      document.querySelector('#close-dialog').onclick = () =>
        document.querySelector('dialog').close();
      const divider = document.querySelector('.divider');
      let drag = null;
      function resize(width) {
        const value = Math.max(240, Math.min(420, width));
        document
          .querySelector('.layout')
          .style.setProperty('--left', value + 'px');
        divider.setAttribute('aria-valuenow', String(value));
      }
      divider.onpointerdown = (event) => {
        drag = {
          x: event.clientX,
          width: Number(divider.getAttribute('aria-valuenow')),
        };
        divider.setPointerCapture(event.pointerId);
      };
      divider.onpointermove = (event) => {
        if (drag) resize(drag.width + event.clientX - drag.x);
      };
      divider.onpointerup = divider.onpointercancel = () => {
        drag = null;
      };
      divider.onkeydown = (event) => {
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault();
          resize(
            Number(divider.getAttribute('aria-valuenow')) +
              (event.key === 'ArrowRight' ? 10 : -10),
          );
        }
      };
      window.addEventListener('dragover', (event) => event.preventDefault());
      window.addEventListener('drop', (event) => {
        event.preventDefault();
        toast('设计预览不读取文件；正式版将在检测和变更预览后再导入。');
      });
      render();
    </script>
  </body>
</html>
